services:
  # ==========================================
  # Frontend Service (PWA + React 19 + Nginx)
  # ==========================================
  frontend:
    container_name: vizagivf-hrms-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "9580:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
